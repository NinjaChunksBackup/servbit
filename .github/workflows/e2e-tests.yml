name: E2E Tests

# A full production build plus the browser matrix takes a few minutes, so pull
# requests only pay for it when they touch application code, the tests, or the
# dependency tree. Pushes to main and the weekly cron run it unconditionally.
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/critical-flows/**'
      - 'playwright.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.js'
      - '.github/workflows/e2e-tests.yml'
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

concurrency:
  group: e2e-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # Forks cannot reach this repository's Actions secrets, so they run the
    # suite against public infrastructure only.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_DEFAULT_SITE_URL: http://127.0.0.1:3000
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      PLAYWRIGHT_WEB_SERVER_COMMAND: npm run start -- --hostname 127.0.0.1

    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@v2 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production application
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      # Advisory, not a gate. webkit is slow enough on these pages that
      # hydration races still surface as flakes, and a red X on every PR would
      # be noise, so the outcome goes to the job summary and the uploaded
      # report instead of failing the run. Setup failures (install, build,
      # browsers) still fail.
      - name: Run critical user flows
        id: critical
        continue-on-error: true
        run: npm run test:critical

      - name: Report critical flow outcome
        if: always()
        run: |
          if [ "${{ steps.critical.outcome }}" = "success" ]; then
            echo "### Critical user flows passed" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Critical user flows reported failures"
              echo
              echo "This step is advisory and does not fail the build. Download the"
              echo "\`critical-user-flow-report-${{ github.run_attempt }}\` artifact for traces,"
              echo "screenshots, and video of each failure."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: critical-user-flow-report-${{ github.run_attempt }}
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 14